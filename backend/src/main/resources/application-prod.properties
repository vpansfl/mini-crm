# 배포(Render + Aiven MySQL)용 설정. SPRING_PROFILES_ACTIVE=prod 로 활성화한다.

# 별도 마이그레이션 도구가 없으므로 배포 DB에서도 Entity 기준으로 테이블을 생성/보완한다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Aiven 무료 플랜 연결 수 제한을 고려해 커넥션 풀을 작게 유지한다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
