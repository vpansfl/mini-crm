spring.application.name=backend

# 별도 프로필을 지정하지 않으면 로컬 개발용(dev) 설정을 사용한다.
spring.profiles.default=dev

# MySQL 연결 정보 (비밀번호는 코드에 두지 않고 환경변수 DB_PASSWORD로만 받는다)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_crm}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false

# CORS 허용 Origin (Vite 개발 서버 기본 포트)
app.cors.allowed-origins=http://localhost:5173

# HubSpot API (Service Key는 코드/파일에 두지 않고 환경변수 HUBSPOT_ACCESS_TOKEN으로만 받는다)
# 토큰이 없어도 서버는 기동되며, 동기화 API 호출 시 503 오류로 안내한다.
hubspot.base-url=https://api.hubapi.com
hubspot.access-token=${HUBSPOT_ACCESS_TOKEN:}
hubspot.page-size=100
hubspot.connect-timeout=5s
hubspot.read-timeout=10s
